<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/just-fire-doors-design-system-26c07651-4464-46af-9870-fadfafc8565c/tokens/fonts.css">
<link rel="stylesheet" href="_ds/just-fire-doors-design-system-26c07651-4464-46af-9870-fadfafc8565c/tokens/colors.css">
<link rel="stylesheet" href="_ds/just-fire-doors-design-system-26c07651-4464-46af-9870-fadfafc8565c/tokens/typography.css">
<link rel="stylesheet" href="_ds/just-fire-doors-design-system-26c07651-4464-46af-9870-fadfafc8565c/tokens/layout.css">
<link rel="stylesheet" href="_ds/just-fire-doors-design-system-26c07651-4464-46af-9870-fadfafc8565c/tokens/effects.css">
<link rel="stylesheet" href="_ds/just-fire-doors-design-system-26c07651-4464-46af-9870-fadfafc8565c/css/jfd.css">
<link rel="stylesheet" href="_ds/just-fire-doors-design-system-26c07651-4464-46af-9870-fadfafc8565c/styles.css">
<script src="_ds/just-fire-doors-design-system-26c07651-4464-46af-9870-fadfafc8565c/_ds_bundle.js"></script>
</helmet>
<section aria-label="Accreditation and proof" style="background: var(--jfd-tint); borderTop: 3px solid var(--jfd-azure); borderBottom: 1px solid var(--jfd-rule)">
  <div style="maxWidth: 1240px; margin: 0 auto; padding: 26px clamp(20px, 5vw, 28px); display: flex; flexWrap: wrap; alignItems: center; gap: 22px 40px">
    <div style="display: flex; alignItems: center; gap: 22px; flexWrap: wrap">
      <img src="assets/bsc-fire-door-installation.jpg" alt="BlueSky Certified Installer — Fire Door Installation, FDI-146" style="width: 52px; height: 52px; borderRadius: 50%; objectFit: cover; transform: scale(1.03)">
      <img src="assets/door-data-systems.jpeg" alt="Door Data Systems — door-level evidence records" style="height: 60px; width: auto; mixBlendMode: multiply">
      <img src="assets/university-of-plymouth.png" alt="University of Plymouth" style="height: 34px; width: auto">
    </div>
    <span aria-hidden="true" style="width: 1px; height: 40px; background: #D0D7DE"></span>
    <div style="display: flex; flexWrap: wrap; gap: 18px 40px">
      <sc-for list="{{ stats }}" as="st" hint-placeholder-count="2">
        <span style="display: block"><span style="display: block; fontFamily: var(--jfd-font-display); fontSize: 30px; fontWeight: 600; letterSpacing: '-0.02em'; lineHeight: 1">{{ st.n }}</span><span style="display: block; fontSize: 13.5px; color: var(--jfd-ink-3); marginTop: 3px">{{ st.label }}</span></span>
      </sc-for>
    </div>
    <a href="Projects.dc.html" class="jfd-link" style="marginLeft: auto; fontSize: 15px">See the projects →</a>
  </div>
  <sc-if value="{{ showNote }}" hint-placeholder-val="{{ false }}">
    <div style="maxWidth: 1240px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 28px) 22px">
      <p style="fontFamily: var(--jfd-font-mono); fontSize: 11px; letterSpacing: '0.05em'; textTransform: uppercase; color: #8A6100; border: 1px dashed #C9B27A; background: #FBF7EC; padding: 8px 12px; margin: 0; lineHeight: 1.6; display: inline-block">To confirm · {{ note }}</p>
    </div>
  </sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;140px&quot;},&quot;stats&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{n:string,label:string}[]&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      stats: this.props.stats ?? [
        { n: '~150', label: 'doors across two schools' },
        { n: '~35', label: 'laboratory doorsets, University of Plymouth' }
      ],
      showNote: !!(this.props.showNotes && this.props.note)
    };
  }
}
</script>
</body>
</html>
