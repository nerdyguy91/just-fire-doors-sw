<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/just-fire-doors-design-system-26c07651-4464-46af-9870-fadfafc8565c/tokens/fonts.css">
<link rel="stylesheet" href="_ds/just-fire-doors-design-system-26c07651-4464-46af-9870-fadfafc8565c/tokens/colors.css">
<link rel="stylesheet" href="_ds/just-fire-doors-design-system-26c07651-4464-46af-9870-fadfafc8565c/tokens/typography.css">
<link rel="stylesheet" href="_ds/just-fire-doors-design-system-26c07651-4464-46af-9870-fadfafc8565c/tokens/layout.css">
<link rel="stylesheet" href="_ds/just-fire-doors-design-system-26c07651-4464-46af-9870-fadfafc8565c/tokens/effects.css">
<link rel="stylesheet" href="_ds/just-fire-doors-design-system-26c07651-4464-46af-9870-fadfafc8565c/css/jfd.css">
<link rel="stylesheet" href="_ds/just-fire-doors-design-system-26c07651-4464-46af-9870-fadfafc8565c/styles.css">
<script src="_ds/just-fire-doors-design-system-26c07651-4464-46af-9870-fadfafc8565c/_ds_bundle.js"></script>
</helmet>
<section id="evidence" aria-label="Close-out evidence" style="background: #FFFFFF; borderBottom: 1px solid var(--jfd-rule)">
  <div style="maxWidth: 1240px; margin: 0 auto; padding: clamp(53px, 8.8vw, 88px) clamp(20px, 5vw, 28px); display: grid; gridTemplateColumns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: clamp(28px, 6vw, 56px) 80px; alignItems: start">
    <div style="minWidth: 0">
      <p class="jfd-eyebrow">{{ eyebrow }}</p>
      <h2 class="jfd-h2" style="margin: 0 0 22px; maxWidth: 18ch; textWrap: pretty">{{ title }}</h2>
      <sc-for list="{{ introLines }}" as="ln" hint-placeholder-count="1">
        <p style="fontSize: 17.5px; lineHeight: 1.62; color: var(--jfd-ink-2); margin: 0 0 16px; maxWidth: 50ch; textWrap: pretty">{{ ln }}</p>
      </sc-for>
      <p style="fontFamily: var(--jfd-font-mono); fontSize: 10.5px; letterSpacing: '0.08em'; textTransform: uppercase; color: var(--jfd-ink-3); margin: 26px 0 4px">{{ listTitle }}</p>
      <ul style="listStyle: none; margin: 0; padding: 0; maxWidth: 52ch">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
          <li style="display: grid; gridTemplateColumns: 34px minmax(0, 1fr); gap: 10px; padding: 11px 0; borderTop: 1px solid var(--jfd-rule-soft); fontSize: 16px; lineHeight: 1.5; color: var(--jfd-graphite)"><span style="fontFamily: var(--jfd-font-mono); fontSize: 11.5px; color: var(--jfd-ink-4); paddingTop: 3px">{{ r.n }}</span><span>{{ r.t }}</span></li>
        </sc-for>
      </ul>
      <sc-if value="{{ hasChain }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flexWrap: wrap; alignItems: center; gap: 8px 12px; marginTop: 24px; padding: 14px 16px; background: var(--jfd-tint); fontFamily: var(--jfd-font-mono); fontSize: 12px; letterSpacing: '0.06em'; textTransform: uppercase; color: var(--jfd-graphite)">
          <sc-for list="{{ chainRows }}" as="c" hint-placeholder-count="4">
            <span style="display: inline-flex; gap: 12px; alignItems: center"><span>{{ c.t }}</span><span style="color: #7FA6C2">{{ c.sep }}</span></span>
          </sc-for>
        </div>
      </sc-if>
      <div style="marginTop: 30px; paddingTop: 22px; borderTop: 1px solid var(--jfd-rule)">
        <span class="jfd-status jfd-status--closed" style="marginBottom: 10px">Closed on the job sheet</span>
        <p style="fontFamily: var(--jfd-font-display); fontSize: clamp(26px, 2.6vw, 32px); fontWeight: 600; lineHeight: 1.18; letterSpacing: '-0.02em'; margin: 0 0 12px; maxWidth: 26ch; textWrap: pretty">{{ outcome }}</p>
        <sc-if value="{{ hasClosing }}" hint-placeholder-val="{{ false }}">
          <p style="fontSize: 16px; lineHeight: 1.6; color: var(--jfd-ink-3); margin: 0; maxWidth: 48ch">{{ closing }}</p>
        </sc-if>
      </div>
      <sc-if value="{{ showNote }}" hint-placeholder-val="{{ false }}">
        <p style="fontFamily: var(--jfd-font-mono); fontSize: 11px; letterSpacing: '0.05em'; textTransform: uppercase; color: #8A6100; border: 1px dashed #C9B27A; background: #FBF7EC; padding: 8px 12px; margin: 24px 0 0; lineHeight: 1.6; maxWidth: 62ch">To confirm · {{ note }}</p>
      </sc-if>
    </div>
    <figure style="minWidth: 0; margin: 0">
      <div style="display: grid; gridTemplateColumns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 16px; background: var(--jfd-tint); border: 1px solid var(--jfd-rule); padding: 20px">
        <sc-for list="{{ shots }}" as="sh" hint-placeholder-count="2">
          <div style="minWidth: 0">
            <div style="background: #121620; padding: 8px; border: 1px solid #3C4348">
              <div style="aspectRatio: 9 / 16; overflow: hidden; background: #212634"><sc-if value="{{ sh.src }}" hint-placeholder-val="{{ false }}"><img src="{{ sh.src }}" alt="{{ sh.alt }}" style="width: 100%; height: 100%; objectFit: cover; objectPosition: {{ sh.pos }}; display: block"></sc-if></div>
            </div>
            <span style="display: block; fontFamily: var(--jfd-font-mono); fontSize: 10.5px; letterSpacing: '0.07em'; textTransform: uppercase; color: var(--jfd-ink-3); marginTop: 10px; lineHeight: 1.5">{{ sh.label }}</span>
          </div>
        </sc-for>
      </div>
      <figcaption style="fontFamily: var(--jfd-font-mono); fontSize: 10.5px; letterSpacing: '0.07em'; textTransform: uppercase; color: var(--jfd-ink-4); marginTop: 12px; lineHeight: 1.6">{{ caption }}</figcaption>
    </figure>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;900px&quot;},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Close&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Finish with clear evidence of what’s been completed.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;intro&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;listTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Your team still needs to know&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;chain&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;outcome&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Finish with clear evidence of what’s closed on the job sheet.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;closing&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;shots&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{src,alt,label,pos}[]&quot;},&quot;caption&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const items = p.items ?? [];
    const chain = p.chain ?? [];
    return {
      introLines: p.intro ?? [],
      rows: items.map((t, i) => ({ t, n: String(i + 1).padStart(2, '0') })),
      hasChain: chain.length > 0,
      chainRows: chain.map((t, i) => ({ t, sep: i < chain.length - 1 ? '→' : '' })),
      hasClosing: !!p.closing,
      showNote: !!(p.showNotes && p.note),
      shots: p.shots ?? [
        { src: ((window.__resources||{})["src/assets/images/evidence/dds-gap-checks.jpeg"]||"assets/dds-gap-checks.jpeg"), alt: 'Door Data Systems record showing gap checks with photos per door', label: 'Gap checks · photo per measurement', pos: '50% 0%' },
        { src: ((window.__resources||{})["src/assets/images/evidence/dds-install-checks.jpeg"]||"assets/dds-install-checks.jpeg"), alt: 'Door Data Systems installation checks with photo evidence', label: 'Installation checks · 2 of 22', pos: '50% 0%' }
      ],
      caption: p.caption ?? 'Door Data Systems (DDS) — live JFD records, local council project'
    };
  }
}
</script>
</body>
</html>
