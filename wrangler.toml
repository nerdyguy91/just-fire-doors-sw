# Cloudflare Pages configuration. Because this file exists, Pages reads bindings from it (not
# from the dashboard) for both Preview and Production deploys, and for `npx wrangler pages dev`.
#
# - The top-level settings apply to Preview deploys and local development.
# - [env.production] overrides them for the production branch (main).
# - Secrets (RESEND_API_KEY, TURNSTILE_SECRET_KEY, FILE_LINK_SECRET, FORM_TO_EMAIL,
#   FORM_FROM_EMAIL) are set in the Pages dashboard or with `wrangler pages secret put`, never here.
#   Locally they come from .dev.vars (copy .env.example).
name = "just-fire-doors"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

# Plain (non-secret) settings. Also available to the build, so PUBLIC_* values reach the pages.
# Bindings and vars aren't inherited by [env.production], so production repeats them below.
[vars]
PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAFOeXH4D-odAGCjY"

# Private bucket for enquiry uploads: Preview and local. Locally, Wrangler simulates it on disk
# (.wrangler/) and never touches the real bucket.
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "jfd-enquiry-uploads-preview"

[env.production]

[env.production.vars]
PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAFOeXH4D-odAGCjY"

[[env.production.r2_buckets]]
binding = "UPLOADS"
bucket_name = "jfd-enquiry-uploads"
