# FAQ set for inspections. Ported from docs/prototype/pages/service-inspections.dc.html.
title: Fire door inspection FAQs
items:
  - q: What is included in a fire door inspection?
    a:
      - >-
        A fire door inspection looks at the condition of the door assembly and associated
        components. Depending on the door and site, this can include the door leaf and frame, gaps
        and alignment, hinges, door closers, seals, glazing, ironmongery and visible condition or
        certification issues.
      - >-
        The resulting report should make clear what was inspected, what was identified and what
        requires action.
  - q: How often should fire doors be inspected?
    a:
      - >-
        The appropriate inspection regime can depend on the building, its use, the applicable
        requirements, the condition and usage of the doors and the level of risk involved.
      - >-
        JFD can assess your current doors and help you understand what an appropriate future
        inspection or maintenance programme could look like.
  - q: How much does a fire door inspection cost?
    a:
      - >-
        Cost varies according to factors such as the number of doors, number of sites, location,
        access requirements and the level of reporting required.
      - Tell us roughly how many doors and sites are involved and we can scope the requirement.
  - q: What’s the difference between a fire door inspection and a fire door survey?
    a:
      - >-
        In practice, fire door inspection and fire door survey are often used to describe the same
        broad requirement: assessing fire doors to understand their condition and identify issues
        requiring attention.
      - >-
        The exact scope and reporting requirements should be agreed before the inspection so you
        know what you will receive.
  - q: What happens if the inspection identifies remedial work?
    a:
      - The report should identify the issues requiring action.
      - >-
        JFD can then help scope and carry out fire door repairs and remedial works, or replacement
        where required.
      - You aren’t obliged to use JFD for that subsequent work.
    link:
      label: Fire Door Repairs & Remedial Works →
      href: /services/fire-door-remedial-works/
  - q: Can JFD inspect multiple sites?
    a:
      - Yes, subject to the scope and location of the requirement.
      - >-
        If you manage several properties, tell us where they are and roughly how many fire doors are
        involved so we can establish the most practical inspection approach.
  - q: Can you work from an existing fire door survey instead?
    a:
      - Yes.
      - >-
        If you already have a suitable inspection report, survey or job sheet, send it over rather
        than automatically starting again.
      - We can review the identified actions and help establish what needs to happen next.
