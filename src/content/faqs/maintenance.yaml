# FAQ set for maintenance. Ported from docs/prototype/pages/service-maintenance.dc.html.
title: Fire door maintenance FAQs
items:
  - q: What does fire door maintenance include?
    a:
      - >-
        Depending on the doors and issues identified, maintenance can include checks of existing
        doors, adjustments, work to closers, hinges, seals, gaps, alignment and ironmongery, minor
        repairs and the identification of more substantial remedial or replacement work.
      - The exact scope should reflect the doors and estate being maintained.
  - q: How often should fire doors be maintained?
    a:
      - There isn’t one useful maintenance interval for every building.
      - >-
        Frequency can depend on factors including building use, door usage, condition, risk and the
        requirements applying to the premises.
      - >-
        Once JFD understands your estate and current records, we can help establish a more
        appropriate maintenance approach.
  - q: What’s the difference between a fire door inspection and maintenance?
    a:
      - >-
        An inspection is primarily about assessing the condition of the doors and identifying
        issues.
      - >-
        Maintenance is the practical work involved in keeping doors functioning properly and dealing
        with issues that arise.
      - >-
        In an ongoing programme, the two naturally connect: inspect, identify, maintain or repair,
        record and review.
  - q: Can fire doors be repaired during a maintenance visit?
    a:
      - Some straightforward issues may be suitable for maintenance or adjustment.
      - Other defects may require a separate remedial scope, further investigation or replacement.
  - q: What happens if a door needs replacing?
    a:
      - >-
        Where maintenance identifies that repair is no longer appropriate, JFD can help scope and
        deliver the required replacement work.
    link:
      label: Fire Door Replacement & Installation →
      href: /services/fire-door-installation/
  - q: Can JFD maintain fire doors across multiple sites?
    a:
      - Potentially, yes.
      - >-
        If you manage several properties across the South West, tell us where they are and how your
        fire doors are currently being managed.
      - We can then establish whether JFD is a suitable fit for the programme.
  - q: Can you take over an existing fire door maintenance programme?
    a:
      - Potentially.
      - >-
        The first step would be to understand how your current programme works, what records already
        exist and what you need JFD to take responsibility for.
  - q: Can we start with only part of our estate?
    a:
      - Yes.
      - >-
        A programme can begin with a single property, priority sites or another defined piece of
        work rather than moving the entire estate at once.
  - q: What records do we receive after maintenance work?
    a:
      - >-
        The aim is to provide clear records showing the work carried out against the relevant doors,
        together with supporting evidence and anything that still requires attention.
