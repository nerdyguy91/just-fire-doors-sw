# FAQ set for installation. Ported from docs/prototype/pages/service-replacement.dc.html.
title: Fire door installation FAQs
items:
  - q: When does a fire door need replacing rather than repairing?
    a:
      - It depends on the door, the defect, its condition and the evidence available.
      - >-
        Some issues can be resolved through repair. Others require replacement. Where the
        information isn’t clear enough, further investigation may be needed before the right action
        can be confirmed.
  - q: Can JFD supply as well as install replacement fire doors?
    a:
      - >-
        Yes. JFD’s current service materials state that it supplies and installs replacement fire
        doors and doorsets.
  - q: What is included in a fire door installation?
    a:
      - That depends on the project and specification.
      - >-
        A replacement installation may involve the doorset, frame, relevant ironmongery, closer,
        seals, glazing, finishes and the associated installation and completion records.
      - The exact scope should be agreed for each opening.
  - q: How much does fire door replacement cost?
    a:
      - >-
        Cost depends on the doorset specification, size, glazing, ironmongery, frame or opening
        condition, finish, access, quantity and any specialist requirements.
      - >-
        If you already have a survey or door schedule, send it over so the actual requirement can be
        priced.
  - q: How long does it take to replace a fire door?
    a:
      - There isn’t one useful installation time for every door.
      - >-
        The programme depends on the doorset, opening condition, site, access, quantity and any
        specialist requirements.
      - >-
        Once the scope is understood, the work can be planned around the site and project
        requirements.
  - q: Can replacement fire doors be installed in occupied buildings?
    a:
      - Yes, subject to the project and site conditions.
      - >-
        JFD has relevant project experience in healthcare and education environments where
        installation work needs to be planned around people using the building.
  - q: Can JFD work from an existing fire door survey or door schedule?
    a:
      - Yes.
      - >-
        If you already have a survey, specification, schedule or job sheet identifying replacement
        doors, send it over.
      - We can start by reviewing the information you already have.
  - q: What documentation do we receive after installation?
    a:
      - >-
        JFD’s existing materials state that documentation and certification are provided on
        completion.
  - q: Can JFD replace fire doors across multiple sites?
    a:
      - Potentially, yes.
      - >-
        If your replacement programme covers several South West properties, send us the schedule and
        locations so we can understand the work involved.
  - q: What happens if additional issues are discovered during installation?
    a:
      - >-
        If something is found that changes the agreed scope, the issue should be raised and the
        required next action agreed before uncontrolled additional work goes ahead.
